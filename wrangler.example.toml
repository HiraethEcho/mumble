# 示例配置 — 复制为 wrangler.toml 并填入真实值
# wrangler.toml 已被 .gitignore 忽略（含敏感信息），勿提交
name = "mumble"
main = "worker/index.js"
compatibility_date = "2026-08-06"
assets = { directory = "./public" }

[[d1_databases]]
binding = "DB"
database_name = "mumble-db"
# 替换为真实 database_id：npx wrangler d1 create mumble-db 的输出
database_id = "00000000-0000-0000-0000-000000000000"

[vars]
# 非敏感 text 配置
ADMIN_NAME = "admin"     # 管理员昵称
ADMIN_EMAIL = "admin@example.com"  # 管理员邮箱
